site_name: Django CRUD Views CoreUI
theme: readthedocs
plugins:
    - search
    - awesome-pages
repo_url: https://github.com/jacob-consulting/django-crud-views-coreui
edit_uri: blob/main/docs/

nav:
    - Home: index.md
    - Installation: installation.md
    - Branding: branding.md
    - Layouts: layouts.md
    - Icons: icons.md
    - Crispy template pack: crispy_coreui.md
    - Theme internals: theme_internals.md
    - Demo: demo.md
    - Development: development.md

markdown_extensions:
    - admonition
    - pymdownx.superfences

validation:
    anchors: warn
